<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventGenie AI — Your Celebration, Perfectly Planned</title>
  <meta name="description" content="Personal AI Event Manager for Weddings, Birthdays, College Fests, and Celebrations. Real-time deterministic budget calculations, automated run-of-show schedules, vendor guides, and contextual planning copilot.">
  
  <!-- Favicon / Brand Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            midnight: '#070A12',
            surface: '#0E1424',
            violetAccent: '#8B5CF6',
            coralAccent: '#F43F5E',
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Design System Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-[#070A12] text-slate-100 min-h-screen selection:bg-violet-600 selection:text-white">

  <!-- Main Single Page Application Root -->
  <div id="app-root" class="relative z-10 flex flex-col min-h-screen">
    
    <!-- Initial Loading Skeleton (Replaced immediately by app.js) -->
    <div class="flex-1 flex flex-col items-center justify-center p-8 space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-violet-600 to-rose-500 animate-pulse flex items-center justify-center text-white text-xl font-bold shadow-2xl">
        ✨
      </div>
      <div class="text-sm font-semibold text-slate-300">Initializing EventGenie AI...</div>
      <div class="text-xs text-slate-500">Loading celebration templates & mathematical engine</div>
    </div>

  </div>

  <!-- App Bootstrap Module -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
